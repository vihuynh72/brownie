# The worker serves no application traffic: the port below is switched off,
# and the only thing it listens on is the management port further down, which
# answers whether it is alive and whether the database and the blob store are
# reachable. Both are needed before it can do anything at all, so a worker
# that cannot reach them is not ready, and whatever is watching it should say
# so rather than report a running container as a working one.
server:
  port: -1

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Liveness deliberately stays as it is: it answers "restart me", and a
        # storage outage is not something restarting fixes. Readiness answers
        # "send me work", and without the blob store this process
        # cannot remove a deleted file or keep the record of having done so --
        # so it should say so rather than report itself fit through an outage
        # of the one place every file lives.
        readiness:
          include: readinessState, db, fileStorage, deletionRecordStorage

spring:
  application:
    name: brownie-worker
  datasource:
    url: ${BROWNIE_DB_URL}
    username: ${BROWNIE_DB_USERNAME}
    password: ${BROWNIE_DB_PASSWORD}
    hikari:
      # As in brownie-api: a pass that cannot get a connection fails in
      # seconds and runs again on its next turn, instead of holding its
      # thread for the pool's default half minute.
      connection-timeout: 5000
  ai:
    openai:
      # Same convention as brownie-api's identical entry: no default, so a
      # real profile fails fast if unset.
      api-key: ${BROWNIE_OPENAI_API_KEY}
      # As in brownie-api: the provider's client sends each request once, so
      # that every request sent is one the usage ledger reserved. Retrying is
      # the application's decision, made where the reservation is made.
      max-retries: 0
      chat:
        max-retries: 0

brownie:
  environment: ${BROWNIE_ENVIRONMENT:local}
  worker:
    # How long each kind of leftover is kept. brownie-api reads the same
    # four variables to tell people what happens to their data, so what is
    # said and what is done are one setting.
    retention:
      artifact-sweep:
        abandoned-after: ${BROWNIE_RETENTION_ABANDONED_UPLOAD:PT24H}
        rejected-after: ${BROWNIE_RETENTION_REFUSED_FILE:PT24H}
        unreferenced-after: ${BROWNIE_RETENTION_UNUSED_FILE:PT24H}
      ledger-maintenance:
        audit-retention: ${BROWNIE_RETENTION_AUDIT_RECORD:P90D}
    # serve: claim jobs and run every sweep until stopped (the default).
    # replay-deletions: apply the deletions recorded outside the database to
    # the database this worker is pointed at, report, and end. Nothing on a
    # timer runs in that mode. It is the step between restoring a backup and
    # letting anyone in; any other value is refused at start-up.
    mode: ${BROWNIE_WORKER_MODE:serve}
  storage:
    # As in brownie-api: the connection string locally, the two endpoints and
    # the platform's own identity when hosted. The worker writes the deletion
    # record and removes stored files, so it needs both.
    local-connection: ${BROWNIE_LOCAL_STORAGE_CONNECTION:}
    endpoint: ${BROWNIE_STORAGE_ENDPOINT:}
    deletion-record-endpoint: ${BROWNIE_DELETION_RECORD_STORAGE_ENDPOINT:}
  usage:
    # The model allowance, enforced by the usage ledger before every request
    # is sent. brownie-api and brownie-worker must be given the same values:
    # each checks the requests it makes itself against the same ledger.
    # A run's bound counts every attempt and resume of its job; the monthly
    # bounds are calendar months in UTC.
    run-max-requests: ${BROWNIE_MODEL_RUN_MAX_REQUESTS:6}
    run-limit-usd: ${BROWNIE_MODEL_RUN_USD_LIMIT:0.10}
    workspace-monthly-limit-usd: ${BROWNIE_MODEL_WORKSPACE_MONTHLY_USD_LIMIT:2.00}
    global-monthly-limit-usd: ${BROWNIE_MODEL_MONTHLY_USD_LIMIT:15.00}
  ai:
    openai:
      # The one evaluated snapshot this gateway is fixed to -- must match
      # brownie-api's own identical default, since both call the same
      # model gateway adapter.
      model: ${BROWNIE_OPENAI_MODEL:gpt-5.4-mini-2026-03-17}

logging:
  structured:
    format:
      console: ecs
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  ai:
    openai:
      # Same unreachable-but-syntactically-valid convention as brownie-api's
      # identical entry: building the ChatModel bean needs a non-blank
      # value but never touches the network on its own.
      api-key: sk-test-not-a-real-key
brownie:
  storage:
    # A syntactically valid but unreachable endpoint keeps the fast context
    # test offline. Blob client construction is lazy; real output tests set
    # this to their disposable Azurite connection string.
    local-connection: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:65535/devstoreaccount1/"
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: pilot
logging:
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: production
logging:
  level:
    io.github.vihuynh72.brownie: WARN
