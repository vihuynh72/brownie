spring:
  application:
    name: brownie-worker
  main:
    web-application-type: none
  datasource:
    url: ${BROWNIE_DB_URL}
    username: ${BROWNIE_DB_USERNAME}
    password: ${BROWNIE_DB_PASSWORD}
  ai:
    openai:
      # Same convention as brownie-api's identical entry: no default, so a
      # real profile fails fast if unset.
      api-key: ${BROWNIE_OPENAI_API_KEY}

brownie:
  environment: ${BROWNIE_ENVIRONMENT:local}
  storage:
    local-connection: ${BROWNIE_LOCAL_STORAGE_CONNECTION:}
  ai:
    openai:
      # The one evaluated snapshot this gateway is fixed to -- must match
      # brownie-api's own identical default, since both call the same
      # model gateway adapter.
      model: ${BROWNIE_OPENAI_MODEL:gpt-5.4-mini-2026-03-17}

logging:
  structured:
    format:
      console: ecs
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  ai:
    openai:
      # Same unreachable-but-syntactically-valid convention as brownie-api's
      # identical entry: building the ChatModel bean needs a non-blank
      # value but never touches the network on its own.
      api-key: sk-test-not-a-real-key
brownie:
  storage:
    # A syntactically valid but unreachable endpoint keeps the fast context
    # test offline. Blob client construction is lazy; real output tests set
    # this to their disposable Azurite connection string.
    local-connection: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:65535/devstoreaccount1/"
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: pilot
logging:
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: production
logging:
  level:
    io.github.vihuynh72.brownie: WARN
