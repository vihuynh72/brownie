# No NGINX same-origin proxy exists yet, so brownie-api itself must be the
# one loopback origin used for local development -- the same origin as
# BROWNIE_PUBLIC_ORIGIN below and the callback registered with the
# identity provider: http://localhost:8081/login/oauth2/code/entra.
server:
  port: 8081
  tomcat:
    # A form-encoded body is read by the server itself, where the limit on
    # request bodies cannot see it, so the server's own limit is set to match.
    max-http-form-post-size: 1MB

spring:
  application:
    name: brownie-api
  servlet:
    multipart:
      # No route takes a multipart body: a file is sent as the body of a PUT.
      # Left on, the server would parse one for anybody, signed in or not,
      # into temporary files, ten times past the limit on request bodies and
      # outside its view.
      enabled: false
  ai:
    openai:
      # No default: real profiles fail fast if unset, the same convention
      # BROWNIE_CLAMAV_HOST below already uses. See the test profile block
      # further down for why this cannot simply be blank.
      api-key: ${BROWNIE_OPENAI_API_KEY}
      # The provider's client would otherwise resend a failed request up to
      # three times by itself, inside what the usage ledger recorded as one
      # request. Every request that is sent must be one the ledger reserved,
      # so the client sends each request once and the application's own
      # bounded retry decides whether there is another. The chat-level value
      # is set too because it is the one that wins when it is not its default.
      max-retries: 0
      chat:
        max-retries: 0
  datasource:
    url: ${BROWNIE_DB_URL}
    username: ${BROWNIE_DB_USERNAME}
    password: ${BROWNIE_DB_PASSWORD}
    hikari:
      # How long a request waits for a database connection before giving up.
      # The pool's own default is 30 seconds, which with the database down
      # held every request open for more than 40 and would fill the server
      # with waiting requests; five is long enough for a busy pool and short
      # enough that an outage is answered instead of hung on.
      connection-timeout: 5000
  flyway:
    url: ${BROWNIE_DB_URL}
    user: ${BROWNIE_DB_MIGRATION_USERNAME}
    password: ${BROWNIE_DB_MIGRATION_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          # Registration ID "entra" is load-bearing, not cosmetic: Spring's
          # default redirect-uri template turns it into
          # /login/oauth2/code/entra, which is the exact path registered
          # with the identity provider.
          entra:
            client-id: ${BROWNIE_OIDC_CLIENT_ID:}
            client-secret: ${BROWNIE_OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/entra"
        provider:
          entra:
            # issuer-uri itself is deliberately NOT set here: Spring Boot
            # treats a merely-empty value the same as a real one and still
            # attempts (and fails) OIDC discovery against it, so it must be
            # genuinely absent, not blank, wherever no real tenant exists
            # yet -- see the "test" profile block below, and local/pilot/
            # production further down, which each set the real thing.
            user-name-attribute: sub
  session:
    # Lets a server session survive an API replica change and be revoked on
    # demand, without introducing Redis. Flyway (brownie_migration) owns
    # the schema via V2__create_spring_session_tables.sql, so Spring
    # Boot's own initializer is disabled here. Which store backs the
    # session is decided purely by which store-specific dependency is on
    # the classpath (see the comment on spring-boot-session-jdbc in
    # pom.xml) -- there is no store-type switch to set.
    jdbc:
      initialize-schema: never
  mvc:
    formcontent:
      filter:
        # Spring's FormContentFilter is enabled by default and rewrites a
        # PUT/PATCH/DELETE body into request parameters whenever the
        # request declares Content-Type: application/x-www-form-urlencoded
        # -- including the raw byte stream this API's content-upload route
        # (PUT .../uploads/{id}/content) accepts, which is exactly the
        # default Content-Type curl sends for a plain --data-binary
        # upload. Doing so consumes the request's input stream to build
        # the parameter map, leaving nothing for that route's own
        # request.getInputStream() call to read -- the upload silently
        # "succeeds" with zero bytes recorded instead of failing loudly.
        # Nothing in this API ever wants a PUT/PATCH/DELETE body read as
        # form parameters, so the filter is disabled outright rather than
        # trusted to only affect routes that don't care.
        enabled: false

management:
  # Deliberately a different port from the public API: health/readiness are
  # an operator concern, not a route the public API surface should ever
  # share. No reverse proxy exists yet to enforce this externally, so a
  # separate port keeps the separation real today rather than only on
  # paper.
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

brownie:
  environment: ${BROWNIE_ENVIRONMENT:local}
  public-origin: ${BROWNIE_PUBLIC_ORIGIN:http://localhost:8081}
  web:
    # Where a browser is sent after a sign-in succeeds or fails. Hosted
    # environments serve the web app and this API from one public origin,
    # so the default is that origin; the local profile below overrides it
    # with the Vite dev server's own port, since the identity provider's
    # callback must still arrive at this API's registered address.
    origin: ${BROWNIE_WEB_ORIGIN:${brownie.public-origin}}
  storage:
    # Local/test only -- see AzureBlobStorageConfig, which refuses this setting
    # outright on pilot/production. No production Blob Storage adapter
    # exists yet.
    local-connection: ${BROWNIE_LOCAL_STORAGE_CONNECTION:}
  artifacts:
    max-upload-bytes: ${BROWNIE_MAX_UPLOAD_BYTES:10485760}
  retention:
    # How many days a document stays in the trash before the worker deletes
    # it for good. The same number is reported by the capabilities route, so
    # what a person reads is what is applied. Between 1 and 365.
    trash-days: ${BROWNIE_TRASH_RETENTION_DAYS:30}
    # What the "Your data" page tells people about how long things are kept.
    # brownie-worker's sweeps read the same four variables, so what is said
    # and what is done are one setting and cannot drift apart.
    published:
      abandoned-upload: ${BROWNIE_RETENTION_ABANDONED_UPLOAD:PT24H}
      refused-file: ${BROWNIE_RETENTION_REFUSED_FILE:PT24H}
      unused-file: ${BROWNIE_RETENTION_UNUSED_FILE:PT24H}
      audit-record: ${BROWNIE_RETENTION_AUDIT_RECORD:P90D}
  support:
    # Who people are told to ask about their data: an address, a name, a
    # link. Shown as written. Left empty, the page says nobody has been named.
    contact: ${BROWNIE_SUPPORT_CONTACT:}
  usage:
    # The model allowance, enforced by the usage ledger before every request
    # is sent. brownie-api and brownie-worker must be given the same values:
    # each checks the requests it makes itself against the same ledger.
    # A run's bound counts every attempt and resume of its job; the monthly
    # bounds are calendar months in UTC.
    run-max-requests: ${BROWNIE_MODEL_RUN_MAX_REQUESTS:6}
    run-limit-usd: ${BROWNIE_MODEL_RUN_USD_LIMIT:0.10}
    workspace-monthly-limit-usd: ${BROWNIE_MODEL_WORKSPACE_MONTHLY_USD_LIMIT:2.00}
    global-monthly-limit-usd: ${BROWNIE_MODEL_MONTHLY_USD_LIMIT:15.00}
  security:
    clamav:
      host: ${BROWNIE_CLAMAV_HOST}
      port: ${BROWNIE_CLAMAV_PORT:3310}
  ai:
    openai:
      # The one evaluated snapshot this gateway is fixed to -- a code-level
      # architecture decision, not a per-machine secret, so it defaults
      # here rather than requiring every environment to set it. Changing
      # it is a deliberate, recorded decision, never something a caller's
      # request can select (see OpenAiModelGateway).
      model: ${BROWNIE_OPENAI_MODEL:gpt-5.4-mini-2026-03-17}

logging:
  structured:
    format:
      console: ecs
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        provider:
          entra:
            # For an Entra External ID (customer) tenant this must be the
            # tenant's own ciamlogin.com issuer, exactly as its discovery
            # document states it -- the login.microsoftonline.com form of
            # the same tenant only signs in admin and workforce accounts,
            # and customer accounts get AADSTS500208 from it. See .env.example.
            issuer-uri: ${BROWNIE_OIDC_ISSUER}
# Local development listens on the loopback interface only, on both the
# API and the management port. This profile also hosts the e2e
# session-seeding route (see brownie.test-support.token below) and runs
# with the owner's real model key, so nothing on the local network may
# reach it; the identity provider's callback and the Vite proxy both
# address localhost, which this still serves.
server:
  address: 127.0.0.1
management:
  server:
    address: 127.0.0.1
brownie:
  web:
    origin: ${BROWNIE_WEB_ORIGIN:http://localhost:5173}
  test-support:
    # When set, the e2e session-seeding route exists and requires this
    # exact value in an X-Test-Support-Token header from a loopback client.
    # Unset (the default) means the route does not exist at all.
    token: ${BROWNIE_TEST_SUPPORT_TOKEN:}
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  # A disposable in-memory database, not Postgres: this profile backs the
  # fast, Docker-free context tests (BrownieApiApplicationTests,
  # ApiExceptionHandlerIntegrationTest), which need some real DataSource
  # bean for the JDBC repositories to wire up but never run Flyway or touch
  # a real schema. Tests that need real Postgres behavior
  # (BrownieApiDatabaseIntegrationTest and every @Testcontainers test)
  # override these with @DynamicPropertySource, which always wins over
  # this file.
  datasource:
    url: jdbc:h2:mem:brownie-api-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # No real Entra tenant exists in this profile's fast, Docker-free context
  # (see BrownieApiApplicationTests, ApiExceptionHandlerIntegrationTest):
  # explicit, syntactically valid, never-actually-called endpoints let the
  # oauth2Login security filter chain build without issuer discovery
  # reaching the network, unlike the real profiles below it, which need
  # BROWNIE_OIDC_ISSUER for that discovery to succeed.
  security:
    oauth2:
      client:
        registration:
          entra:
            client-id: test-client
            client-secret: test-secret
        provider:
          entra:
            authorization-uri: http://localhost:65535/oauth2/authorize
            token-uri: http://localhost:65535/oauth2/token
            jwk-set-uri: http://localhost:65535/oauth2/jwks
            user-info-uri: http://localhost:65535/oauth2/userinfo
  # This profile's DataSource is H2, not Postgres, and H2 never gets the
  # spring_session tables (see V2__create_spring_session_tables.sql, which
  # only runs against real Postgres profiles). Having the JDBC session
  # store's autoconfiguration on the classpath at all is enough for it to
  # try INSERTing into a table that doesn't exist here, regardless of any
  # session settings above, so it has to be turned off by name instead.
  autoconfigure:
    exclude: org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
  ai:
    openai:
      # A syntactically valid but fake key, the same unreachable-endpoint
      # convention used throughout this profile: building Spring AI's
      # OpenAiChatModel bean needs some non-blank value, but constructing
      # it never touches the network on its own -- only an actual
      # complete() call does, and the fast, Docker-free tests that run
      # under this profile never make one.
      api-key: sk-test-not-a-real-key
brownie:
  storage:
    # A syntactically valid but unreachable target (port 65535, the same
    # convention the fake OIDC endpoints above use) -- BlobServiceClient
    # construction never touches the network on its own, and the fast,
    # Docker-free tests that run under this profile never call an
    # operation that would. Fixed here rather than left to
    # BROWNIE_LOCAL_STORAGE_CONNECTION so a value a developer happens to
    # have exported in their own shell can never leak into a test run --
    # the same class of bug already found and fixed once in this profile
    # for BROWNIE_ENVIRONMENT.
    local-connection: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:65535/devstoreaccount1;"
  security:
    clamav:
      # Same unreachable-port-65535 convention as the placeholders above --
      # constructing ClamAvMalwareScanner never touches the network on its
      # own (it only connects inside scan(), never at construction), and
      # the fast, Docker-free tests that run under this profile never call
      # scan() at all.
      host: 127.0.0.1
      port: 65535
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: pilot
  security:
    oauth2:
      client:
        provider:
          entra:
            issuer-uri: ${BROWNIE_OIDC_ISSUER}
logging:
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: production
  security:
    oauth2:
      client:
        provider:
          entra:
            issuer-uri: ${BROWNIE_OIDC_ISSUER}
logging:
  level:
    io.github.vihuynh72.brownie: WARN
