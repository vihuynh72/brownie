# No NGINX same-origin proxy exists yet, so brownie-api itself must be the
# one loopback origin used for local development -- the same origin as
# BROWNIE_PUBLIC_ORIGIN below and the callback registered with the
# identity provider: http://localhost:8081/login/oauth2/code/entra.
server:
  port: 8081

spring:
  application:
    name: brownie-api
  datasource:
    url: ${BROWNIE_DB_URL}
    username: ${BROWNIE_DB_USERNAME}
    password: ${BROWNIE_DB_PASSWORD}
  flyway:
    url: ${BROWNIE_DB_URL}
    user: ${BROWNIE_DB_MIGRATION_USERNAME}
    password: ${BROWNIE_DB_MIGRATION_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          # Registration ID "entra" is load-bearing, not cosmetic: Spring's
          # default redirect-uri template turns it into
          # /login/oauth2/code/entra, which is the exact path registered
          # with the identity provider.
          entra:
            client-id: ${BROWNIE_OIDC_CLIENT_ID:}
            client-secret: ${BROWNIE_OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/entra"
        provider:
          entra:
            # issuer-uri itself is deliberately NOT set here: Spring Boot
            # treats a merely-empty value the same as a real one and still
            # attempts (and fails) OIDC discovery against it, so it must be
            # genuinely absent, not blank, wherever no real tenant exists
            # yet -- see the "test" profile block below, and local/pilot/
            # production further down, which each set the real thing.
            user-name-attribute: sub
  session:
    # Lets a server session survive an API replica change and be revoked on
    # demand, without introducing Redis. Flyway (brownie_migration) owns
    # the schema via V2__create_spring_session_tables.sql, so Spring
    # Boot's own initializer is disabled here.
    store-type: jdbc
    jdbc:
      initialize-schema: never

management:
  # Deliberately a different port from the public API: health/readiness are
  # an operator concern, not a route the public API surface should ever
  # share. No reverse proxy exists yet to enforce this externally (that is
  # a later phase); a separate port keeps the separation real today rather
  # than only on paper.
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

brownie:
  environment: ${BROWNIE_ENVIRONMENT:local}
  public-origin: ${BROWNIE_PUBLIC_ORIGIN:http://localhost:8081}

logging:
  structured:
    format:
      console: ecs
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        provider:
          entra:
            issuer-uri: ${BROWNIE_OIDC_ISSUER}
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  # A disposable in-memory database, not Postgres: this profile backs the
  # fast, Docker-free context tests (BrownieApiApplicationTests,
  # ApiExceptionHandlerIntegrationTest), which need some real DataSource
  # bean for PlatformProbeController's repository to wire up but never run
  # Flyway or touch platform_probe's actual schema. Tests that need real
  # Postgres behavior (BrownieApiDatabaseIntegrationTest) override these
  # with @DynamicPropertySource, which always wins over this file.
  datasource:
    url: jdbc:h2:mem:brownie-api-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # No real Entra tenant exists in this profile's fast, Docker-free context
  # (see BrownieApiApplicationTests, ApiExceptionHandlerIntegrationTest):
  # explicit, syntactically valid, never-actually-called endpoints let the
  # oauth2Login security filter chain build without issuer discovery
  # reaching the network, unlike the real profiles below it, which need
  # BROWNIE_OIDC_ISSUER for that discovery to succeed.
  security:
    oauth2:
      client:
        registration:
          entra:
            client-id: test-client
            client-secret: test-secret
        provider:
          entra:
            authorization-uri: http://localhost:65535/oauth2/authorize
            token-uri: http://localhost:65535/oauth2/token
            jwk-set-uri: http://localhost:65535/oauth2/jwks
            user-info-uri: http://localhost:65535/oauth2/userinfo
  session:
    store-type: none
logging:
  level:
    io.github.vihuynh72.brownie: DEBUG

---
spring:
  config:
    activate:
      on-profile: pilot
  security:
    oauth2:
      client:
        provider:
          entra:
            issuer-uri: ${BROWNIE_OIDC_ISSUER}
logging:
  level:
    io.github.vihuynh72.brownie: INFO

---
spring:
  config:
    activate:
      on-profile: production
  security:
    oauth2:
      client:
        provider:
          entra:
            issuer-uri: ${BROWNIE_OIDC_ISSUER}
logging:
  level:
    io.github.vihuynh72.brownie: WARN
