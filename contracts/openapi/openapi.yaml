          format: int64
        templateId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        category:
          type: string
          enum: [VISUAL, CONTENT, BEHAVIOR, VALIDATION, SOURCE]
        scope:
          $ref: "#/components/schemas/RuleScopeRequest"
        payload:
          $ref: "#/components/schemas/RulePayloadRequest"
        status:
          type: string
          enum: [PROPOSED, ACCEPTED, REJECTED]
        humanExplanation:
          type: string
          nullable: true
        authorUserId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    ValidateDocumentRequest:
