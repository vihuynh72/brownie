openapi: 3.1.0
info:
  title: Brownie API
  version: "0.1.0"
  description: >
    The public API surface under /api/v1. This first version documents
    only the platform self-check endpoints -- a real create/read round
    trip through validation, the database, and the shared error contract
    -- used to prove the underlying request pipeline before any real
    domain endpoint exists. It is expected to be removed once real
    endpoints are documented in its place.
servers:
  - url: http://localhost:8081
    description: Local development

paths:
  /api/v1/me:
    get:
      operationId: getCurrentIdentity
      summary: >
        Current identity and workspace memberships. Login
        (/oauth2/authorization/entra) and logout (/logout) are
        browser-redirect flows, not JSON operations, and are not modeled
        here. Effective capabilities are added once authorization checks
        exist.
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not logged in.

  /api/v1/platform/probes:
    post:
      operationId: createPlatformProbe
      summary: Record a platform self-check message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProbeRequest"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema:
                type: string
              description: URL of the created probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "400":
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/platform/probes/{id}:
    get:
      operationId: getPlatformProbe
      summary: Read back a previously recorded platform self-check message.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "404":
          description: No probe with that id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    MeResponse:
      type: object
      required: [userId, issuer, subject, memberships]
      properties:
        userId:
          type: integer
          format: int64
        issuer:
          type: string
        subject:
          type: string
        email:
          type: string
        displayName:
          type: string
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipResponse"

    MembershipResponse:
      type: object
      required: [workspaceId, role]
      properties:
        workspaceId:
          type: integer
          format: int64
        role:
          type: string
          description: "Only OWNER exists until team workspaces are supported."

    CreateProbeRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500

    ProbeResponse:
      type: object
      required: [id, message, createdAt]
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    Error:
      description: >
        The shape of every error response in this API, regardless of
        cause -- see the master plan's API conventions (§12.1).
      type: object
      required: [status, title, code, correlationId, fields, recoveryActions]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable, machine-readable error code (e.g. NOT_FOUND, VALIDATION_FAILED).
        correlationId:
          type: string
          description: Echoes the X-Correlation-Id request/response header.
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        recoveryActions:
          type: array
          items:
            type: string
