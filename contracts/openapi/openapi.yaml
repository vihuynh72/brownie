        type:
          type: string
          enum: [TEXT, DATE]
        cardinality:
          type: string
          enum: [SCALAR, REPEATED]
        requiredness:
          type: string
          enum: [REQUIRED, OPTIONAL]
        bindingKind:
          type: string
          enum: [CONTENT_CONTROL_TAG, STRUCTURAL_NODE]
        tag:
          type: string
          nullable: true
        part:
          type: string
          nullable: true
        nodeId:
          type: string
          nullable: true

    TemplateVersionResponse:
      type: object
      required: [id, templateId, versionNumber, sourceArtifactId, extractionVersionId, status, fields, createdAt]
      properties:
        id:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        versionNumber:
          type: integer
          minimum: 1
        sourceArtifactId:
          type: integer
          format: int64
        extractionVersionId:
          type: integer
          format: int64
        status:
          type: string
          enum: [DRAFT, ACTIVATED]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDefinitionResponse"
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
          nullable: true

    CreateTemplateRequest:
      type: object
      required: [displayName, sourceArtifactId]
      properties:
        displayName:
          type: string
          minLength: 1
        sourceArtifactId:
          type: integer
          format: int64
          minimum: 1

    TemplateDraftResponse:
      type: object
      required: [template, draftVersion]
      properties:
        template:
          $ref: "#/components/schemas/TemplateResponse"
        draftVersion:
          $ref: "#/components/schemas/TemplateVersionResponse"

    BindingRequest:
      type: object
      required: [kind]
      description: Only tag (for CONTENT_CONTROL_TAG) or part/nodeId (for STRUCTURAL_NODE) is required, chosen by kind; the other is ignored.
      properties:
        kind:
          type: string
          enum: [CONTENT_CONTROL_TAG, STRUCTURAL_NODE]
        tag:
          type: string
          nullable: true
        part:
          type: string
          nullable: true
        nodeId:
          type: string
          nullable: true

    FieldDefinitionRequest:
      type: object
      required: [fieldId, type, cardinality, requiredness, binding]
      properties:
        fieldId:
          type: string
          minLength: 1
        type:
          type: string
          enum: [TEXT, DATE]
        cardinality:
          type: string
          enum: [SCALAR, REPEATED]
