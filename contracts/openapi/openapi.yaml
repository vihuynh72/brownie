        resourceType:
          type: string
        resourceId:
          type: integer
          format: int64
        resourceVersion:
          type: integer
          format: int64
        stage:
          type: string
        state:
          type: string
        attemptCount:
          type: integer
          minimum: 0
        availableAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        cancellationRequestedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventResponse:
      type: object
      required: [eventId, workspaceId, jobId, resourceType, resourceId, resourceVersion, stage, jobSequence, type, state, occurredAt]
      properties:
        eventId:
          type: integer
          format: int64
        workspaceId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        resourceType:
          type: string
        resourceId:
          type: integer
          format: int64
        resourceVersion:
          type: integer
          format: int64
        stage:
          type: string
        jobSequence:
          type: integer
          format: int64
        type:
          type: string
        state:
          type: string
        message:
          type: string
          nullable: true
        progressCurrent:
          type: integer
          nullable: true
        progressTotal:
          type: integer
          nullable: true
        occurredAt:
          type: string
          format: date-time

    EventBatchResponse:
      type: object
      required: [resyncRequired, nextEventId, events]
      properties:
        resyncRequired:
          type: boolean
        nextEventId:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"

    Error:
      description: >
        The shape of every error response in this API, regardless of
        cause.
      type: object
      required: [status, title, code, correlationId, fields, recoveryActions]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable, machine-readable error code (e.g. NOT_FOUND, VALIDATION_FAILED).
        correlationId:
          type: string
          description: Echoes the X-Correlation-Id request/response header.
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        recoveryActions:
          type: array
          items:
            type: string
        problems:
          type: array
          description: >
            Present only when code is RULE_VALIDATION_FAILED: one entry per
            way the proposed rule's payload does not hold against the
            draft's own field definitions.
          items:
            type: object
            properties:
              reason:
                type: string
              detail:
                type: string

    DocumentSummaryResponse:
      type: object
      required: [id, title, templateId, templateVersionId, currentRevisionId, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        templateId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        currentRevisionId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    AllocateUploadRequest:
      type: object
      properties:
        filename:
          type: string
          description: Client-supplied filename, sanitized server-side into display metadata.

    ArtifactResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [UPLOADING, QUARANTINED, SCANNING, READY, REJECTED]
        byteCount:
          type: integer
          format: int64
          nullable: true
        sha256:
          type: string
          nullable: true
        detectedMediaType:
          type: string
          enum: [DOCX, PDF, PLAIN_TEXT]
          nullable: true
        displayFilename:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true

    ExtractionResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [COMPLETE, UNSUPPORTED, FAILED]
        parserVersion:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
      description: >
        The full shape carries format-specific fields (feature findings for
        DOCX, page geometry for PDF) not modeled here yet -- the frontend
        workspace only needs the terminal status today.

    TemplateResponse:
      type: object
      required: [id, displayName, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        displayName:
