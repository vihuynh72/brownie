                type: string
        assistSourceMediaTypes:
          type: array
          items:
            type: string
          description: Media types Assist can read as a source today.
        templateMediaTypes:
          type: array
          items:
            type: string
          description: Media types a template can be taught from.

    AssistTextRequest:
      type: object
