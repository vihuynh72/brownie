      properties:
        id:
          type: integer
          format: int64
        artifactId:
          type: integer
          format: int64
        kind:
          type: string
        fetchedAt:
          type: string
          format: date-time

    DocumentSourceResponse:
      type: object
      required: [id, artifactId, kind, fetchedAt, attachedAt]
      properties:
        id:
          type: integer
          format: int64
