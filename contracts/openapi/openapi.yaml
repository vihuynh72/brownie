          type: boolean
        nextEventId:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"

    Error:
      description: >
        The shape of every error response in this API, regardless of
        cause.
      type: object
      required: [status, title, code, correlationId, fields, recoveryActions]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable, machine-readable error code (e.g. NOT_FOUND, VALIDATION_FAILED).
        correlationId:
          type: string
          description: Echoes the X-Correlation-Id request/response header.
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        recoveryActions:
          type: array
          items:
            type: string
        limit:
          type: string
          enum: [WORKSPACE_MONTH, GLOBAL_MONTH]
          description: >
            Present only when code is USAGE_LIMIT_REACHED. WORKSPACE_MONTH
            is this workspace's own monthly allowance, which starts again
            next calendar month; GLOBAL_MONTH is the allowance every
            workspace shares, which only whoever runs the service can raise.
        reason:
          type: string
          description: >
            Present only for some codes: with CONNECTOR_RESOURCE_UNAVAILABLE,
            GONE or CANCELLED for an event, and GONE, ACCESS_LOST, TRASHED,
            DOWNLOAD_RESTRICTED or CHANGED_DURING_COPY for a Drive file; with
            CONNECTOR_RESOURCE_UNSUPPORTED, TYPE or NOT_UTF8 for a Drive file
            (a calendar entry has none); with CONNECTION_RECONNECT_REQUIRED,
            TOKEN_REJECTED, TOKEN_UNREADABLE or PERMISSION_MISSING; with
            CONNECTOR_RESOURCE_REFUSED, the copy's rejection code from the
            same checks an upload meets.
        access:
          type: string
          enum: [DRIVE_FILES, CALENDAR_EVENTS]
          description: Present only when code is CONNECTION_RECONNECT_REQUIRED, naming the connection that must be made again.
        problems:
          type: array
          description: >
            Present only when code is RULE_VALIDATION_FAILED: one entry per
            way the proposed rule's payload does not hold against the
            draft's own field definitions.
          items:
            type: object
            properties:
              reason:
                type: string
              detail:
                type: string

