        foundInPdf:
          type: boolean

    CompilationManifestResponse:
      type: object
      required:
        [id, documentId, revisionId, templateId, templateVersionId, docxArtifactId, docxSha256, pdfArtifactId, pdfSha256,
         rendererVersion, integrityFindings, allIntegrityChecksPassed, compiledAt]
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        revisionId:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        docxArtifactId:
          type: integer
          format: int64
