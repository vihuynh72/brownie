openapi: 3.1.0
info:
  title: Brownie API
  version: "0.1.0"
  description: >
    The public API surface under /api/v1. It includes the platform
    self-check routes and the implemented workspace document, job, and
    persisted progress-event routes.

    Three answers are described here once instead of under each route,
    all in the Error shape. Any route can answer 429 RATE_LIMITED with a
    Retry-After header, when one person (or, for someone not signed in,
    one address) has made more requests of one kind in a minute than
    allowed, and 503 DATABASE_UNAVAILABLE with a Retry-After header. Every
    route that looks up the person asking, which is all of them but
    /api/v1/capabilities and /api/v1/data-practices, can answer 401
    SESSION_NO_LONGER_VALID, when the session is genuine but the person it
    names has no identity record any more, in which case the session has
    been ended. A request body larger than the API reads, other than a
    file upload, is answered 413 CONTENT_TOO_LARGE whatever kind of body
    it says it is.
servers:
  - url: http://localhost:8081
    description: Local development

paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: >
        What this deployment accepts, for a client to show before a person
        chooses a file: the upload size limit and media types the upload
        route enforces, which of them Assist reads as a source, and which
        a template may be taught from.
      responses:
        "200":
          description: The deployment's limits and supported formats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          description: Not signed in.

  /api/v1/data-practices:
    get:
      operationId: getDataPractices
      summary: >
        What this deployment does with what people give it, as the numbers
        and names a privacy page shows: how long each kind of thing is
        kept, which model provider sees source text when a person asks for
        a draft or a rewrite, and whom to ask. Every period is read from
        the same setting the background worker acts on.
      responses:
        "200":
          description: The deployment's data practices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPracticesResponse"

  /api/v1/me:
    get:
      operationId: getCurrentIdentity
      summary: >
        Current identity and workspace memberships. Login
        (/oauth2/authorization/entra) is a browser-redirect flow and is
        not modeled here; logout is (see POST /logout). Effective
        capabilities are added once authorization checks exist.
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not logged in.

  /logout:
    post:
      operationId: logout
      summary: >
        Ends the server session. Requires the same X-XSRF-TOKEN header as
        every other mutation. With "Accept: application/json" the response
        is a 200 carrying the identity provider's end-session URL as
        redirectUrl, which the page then navigates to itself to finish
        signing out at the provider and return to this app's origin;
        without it, the response is the ordinary 302 to that same URL.
      parameters:
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            example: application/json
      responses:
        "200":
          description: Session ended; navigate to redirectUrl to finish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "302":
          description: Session ended; redirected to the identity provider's end-session page.
        "403":
          description: Missing or invalid CSRF token.

  /api/v1/workspaces/{workspaceId}/documents:
    get:
      operationId: listDocuments
      summary: >
        Every document in the workspace, most recently created first, as a
        lightweight summary without full revision content. Not paginated
        yet.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace's documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummaryResponse"
    post:
      operationId: createDocument
      summary: Create a document with its initial immutable revision.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Created, or the stable result of an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Get a document and its selected immutable revision.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/content:
    patch:
      operationId: patchDocumentContent
      summary: Apply typed edits against the expected current revision.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDocumentContentRequest"
      responses:
        "200":
          description: The newly selected revision, or the stable result of an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          description: The expected revision is no longer current.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/fields/review-decision:
    post:
      operationId: recordReviewDecision
      summary: >
        Records a person's own review decision for one field or repeated
        item, independent of its value, evidence, authorship, and lock.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordReviewDecisionRequest"
      responses:
        "200":
          description: The newly appended revision, or the stable result of an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: The expected revision is no longer current.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/fields/lock:
    post:
      operationId: setFieldLock
      summary: >
        Explicitly sets one field or repeated item's lock -- the only
        route that ever changes it deliberately.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFieldLockRequest"
      responses:
        "200":
          description: The newly appended revision, or the stable result of an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: The expected revision is no longer current.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/revisions:
    get:
      operationId: listDocumentRevisions
      summary: List immutable revision history in ascending revision order.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Revision history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentRevisionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/revisions/{revisionId}:
    get:
      operationId: getDocumentRevision
      summary: Get one immutable revision.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/sources:
    get:
      operationId: listDocumentSources
      summary: >
        Every source attached to this document, most recently attached
        first. A source is a workspace-level snapshot; this list is the
        document's own link to it, which is what the workspace shows and
        what Assist extracts from.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document's sources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: attachDocumentSource
      summary: >
        Attach a READY artifact to this document as a source: creates the
        workspace-level snapshot if the artifact has none yet, then links it
        to the document. Attaching the same artifact again returns the same
        link.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachSourceRequest"
      responses:
        "201":
          description: Attached to the document (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/versions/{versionId}/rules:
    get:
      operationId: listTemplateVersionRules
      summary: >
        Every rule revision on one template version, any status, whether the
        version is a draft or activated: what a document's Rules tab reads
        for the version it was created from. The unversioned rules route
        answers only for the current draft.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The version's rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/assist/interpret:
    post:
      operationId: interpretAssistRequest
      summary: >
        Reads a typed request into one bounded Assist command and reports
        its scope (which field and what it holds now, or which finding)
        without doing anything. Free text that matches no command comes back
        as NONE with the list of what Brownie can do.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistTextRequest"
      responses:
        "200":
          description: The interpretation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistInterpretationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/assist/execute:
    post:
      operationId: executeAssistRequest
      summary: >
        Executes the interpreted command against the revision the person
        was looking at. A change or a rewrite returns a patch proposal for
        the ordinary accept route (nothing is applied here); an explanation
        returns text; a draft request returns DRAFT for the client to start
        extraction; a request that cannot be carried out is a 400 with the
        reason. Rewrite and explain make exactly one bounded model call.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistExecuteRequest"
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/UsageLimitReached"
        "502":
          description: The one model call did not produce a usable answer; nothing on the document changed.

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/evidence/{spanId}:
    get:
      operationId: getEvidenceExcerpt
      summary: >
        The excerpt one of this document's values cites. Resolved from the
        exact extraction version the span was created against; 404 unless
        the span exists in this workspace and cites one of this document's
        own sources, so a span id alone opens nothing.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - name: spanId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The cited excerpt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceExcerptResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/generations:
    get:
      operationId: listGenerationRuns
      summary: >
        Every generation run started for this document, most recent first,
        each with the current state of the durable job that carries it and
        the published result artifact once there is one. This is how a
        reloaded page finds a run that is still waiting for answers.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document's generation runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenerationRunResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: startExtraction
      summary: >
        Start grounded fact extraction for a document from an attached
        source. Records a generation run for the document, links the source
        to it, and returns immediately with a durable job to poll via
        GET .../jobs/{jobId}; the trusted worker performs the actual model
        call asynchronously.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExtractionRequest"
      responses:
        "202":
          description: Accepted, or the stable result of an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandReceiptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/UsageLimitReached"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/generations/{jobId}/result:
    get:
      operationId: getExtractionResult
      summary: >
        The artifact a finished extraction job published, if any. 404
        until the worker publishes one; poll GET .../jobs/{jobId} for the
        job's own state first.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResultResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/generations/{jobId}/questions:
    get:
      operationId: getGenerationQuestions
      summary: >
        This job's own open questions, materializing them the first time
        they are asked for once the job leaves itself WAITING_FOR_INPUT
        (poll GET .../jobs/{jobId} for that state first). Empty until then.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: This job's own questions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/generations/{jobId}/apply:
    post:
      operationId: applyGenerationResult
      summary: >
        Turns this finished job's own published result into a real,
        reviewable patch proposal against the document's current
        revision. Nothing is applied to the document yet -- see
        POST .../patch-proposals/{proposalId}/accept.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "201":
          description: Proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchProposalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/generations/{jobId}/resume:
    post:
      operationId: resumeGenerationAfterQuestions
      summary: >
        Freezes every currently answered question for this document and
        requests the worker pick this job back up. A question left open
        is simply not included; the worker's own re-detection raises it
        again if so, the same durable wait as before.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandReceiptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Get the authoritative durable job state.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/cancel:
    post:
      operationId: requestJobCancellation
      summary: Request cooperative cancellation of a non-terminal job.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandReceiptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/resume:
    post:
      operationId: resumeWaitingJob
      summary: Make a durable human-wait job eligible for another claim.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandReceiptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/retry:
    post:
      operationId: retryJob
      summary: >
        Starts a job that gave up (DEAD or FAILED) again, with a fresh run
        of attempts and a new deadline. It needs no idempotency key: asked
        again while the job is queued or running, it answers with the job
        as it is and starts nothing twice. The restart is written to the
        workspace's audit record.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: The job, queued again or already active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Either the job finished or was cancelled, so there is nothing
            to start again (code CONFLICT), or its document has changed or
            is in the trash since the job began, so its result could never
            be accepted (code JOB_TARGET_STALE); start new work instead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/events:
    get:
      operationId: streamWorkspaceEvents
      summary: Stream persisted progress events. Reconnect with Last-Event-ID.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Server-sent event stream. A resync-required event instructs the client to fetch authoritative state.
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          description: Concurrent stream limit reached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/events/poll:
    get:
      operationId: pollWorkspaceEvents
      summary: Poll persisted progress events when SSE is unavailable.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: afterEventId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Events after the cursor, or a resynchronization instruction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/workspaces/{workspaceId}/uploads:
    post:
      operationId: allocateUpload
      summary: Allocate an owned artifact upload.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocateUploadRequest"
      responses:
        "201":
          description: Allocated, awaiting content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"

  /api/v1/workspaces/{workspaceId}/uploads/{artifactId}/content:
    put:
      operationId: uploadArtifactContent
      summary: Stream an allocated artifact's bytes. Content is immutable once received.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Content received and classified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: The upload exceeds the configured size limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The uploaded content is not a supported media type.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/uploads/{artifactId}/complete:
    post:
      operationId: completeUpload
      summary: Verify and finalize an uploaded artifact, scanning it for malware.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: >
            A real terminal or retryable outcome (READY, REJECTED, or still
            QUARANTINED after a scanner failure) -- not necessarily success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/artifacts/{artifactId}/extraction:
    post:
      operationId: extractArtifact
      summary: >
        Run structural extraction on a READY artifact. Always returns 200
        with whichever terminal outcome extraction actually reached
        (COMPLETE, UNSUPPORTED, or FAILED); a real HTTP error means the
        request itself could not be attempted.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: The extraction's terminal outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/templates:
    get:
      operationId: listTemplates
      summary: >
        Every template in the workspace (both ACTIVE and DRAFT), in
        creation order. A caller building a document-creation picker
        filters to entries with a non-null currentActiveVersionId itself.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace's templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateResponse"
    post:
      operationId: createTemplateDraft
      summary: >
        Creates a new custom template's own draft against an already-
        extracted DOCX source. Deliberately returns the draft version
        alongside the template, since a caller needs that version's own
        number for the very next PUT .../draft/bindings call.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDraftResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/draft/candidate-bindings:
    get:
      operationId: getDraftCandidateBindings
      summary: >
        Candidate field bindings proposed from the draft's own extracted
        structure -- a starting point offered back for review, never
        applied by itself. A caller still submits its own chosen fields
        through PUT .../draft/bindings.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: The draft's own proposed candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateBindingReportResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/draft/bindings:
    put:
      operationId: replaceDraftBindings
      summary: >
        Validates every field's binding against the draft's own pinned
        extraction graph before persisting anything -- a rejected set of
        bindings never partially lands.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceBindingsRequest"
      responses:
        "200":
          description: The draft's own newly appended version, with these bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/versions:
    post:
      operationId: activateTemplateVersion
      summary: >
        Activates the draft's current version after re-validating its
        bindings and rules and proving a real sample fill and render --
        refuses an empty field list.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateVersionRequest"
      responses:
        "201":
          description: Activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/versions/{versionId}:
    get:
      operationId: getTemplateVersion
      summary: >
        One template version by its own ID, including its field
        definitions -- read before creating a document against an
        ACTIVATED version.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: The template version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/rules:
    post:
      operationId: proposeRule
      summary: >
        Proposes one rule against the template's own currently open draft
        version, validated against that draft's real field definitions and
        pinned extraction graph before anything is persisted.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeRuleRequest"
      responses:
        "201":
          description: Proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The template does not exist, or has no currently open draft version to propose a rule against.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    get:
      operationId: listRules
      summary: Every rule proposed against the template's current open draft version, in the order proposed.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: The draft's own proposed rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleResponse"
        "409":
          description: The template does not exist, or has no currently open draft version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/rules/{ruleId}:
    get:
      operationId: getRule
      summary: One rule by its own ID.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/rules/{ruleId}/accept:
    post:
      operationId: acceptRule
      summary: >
        Accepts a proposed rule as-is. Accepting a PROTECTED_REGION rule is
        this app's own "lock a region" action -- a person locks a region by
        accepting exactly that proposal, not through a separate mechanism.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "409":
          description: The rule does not exist, or is no longer PROPOSED.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/templates/{templateId}/rules/{ruleId}/reject:
    post:
      operationId: rejectRule
      summary: >
        Rejects a proposed rule. There is no separate edit route --
        "editing" a rejected rule is proposing a fresh one with the
        corrected payload.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "409":
          description: The rule does not exist, or is no longer PROPOSED.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/sources:
    post:
      operationId: attachSource
      summary: Attach a READY artifact as a source, or return the snapshot that already does.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachSourceRequest"
      responses:
        "201":
          description: Attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/patch-proposals/{proposalId}/accept:
    post:
      operationId: acceptPatchProposal
      summary: >
        Applies only the still-CLEAN subset of a proposal against the
        document's real current revision -- a conflicting or locked field
        is left exactly as it is, reported rather than silently skipped.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - name: proposalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptPatchProposalRequest"
      responses:
        "200":
          description: Acted on -- check `applied`; a fully blocked proposal still returns 200 with every field reported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchAcceptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/questions/{questionId}/answer:
    post:
      operationId: answerQuestion
      summary: Answer one open question. There is no route back to OPEN and no route to change an existing answer.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionRequest"
      responses:
        "200":
          description: Answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/validate:
    post:
      operationId: validateDocument
      summary: >
        Run the deterministic validation pipeline against the document's
        current revision. Appends a new revision, so the caller passes
        expectedRevisionId the same way it does for a content edit.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateDocumentRequest"
      responses:
        "201":
          description: Validated, or the stable result of an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationManifestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/revisions/{revisionId}/validation:
    get:
      operationId: getLatestValidation
      summary: The latest validation manifest recorded for this exact revision.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/revisions/{revisionId}/compile:
    post:
      operationId: compileRevision
      summary: >
        Deterministically compile this exact, already-persisted revision
        into a filled DOCX and rendered PDF, without any model call.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "201":
          description: Compiled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompilationManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/revisions/{revisionId}/compilation:
    get:
      operationId: getLatestCompilation
      summary: The latest compilation manifest recorded for this exact revision.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompilationManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/export-approval:
    post:
      operationId: approveExport
      summary: >
        Approve an already-clean validation manifest for export. Refused
        if the manifest is stale against the document's current revision
        or still has an unresolved blocking finding. Approving again what
        is already the document's latest approval (same person, manifest
        and format) answers with that approval, so a repeated request
        records nothing twice. Any other approval, including going back to
        a format chosen earlier, is a new one and becomes the latest, which
        is the one an export follows.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveExportRequest"
      responses:
        "201":
          description: Approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportApprovalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    get:
      operationId: getLatestExportApproval
      summary: The latest export approval recorded for this document, if any.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportApprovalResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/export:
    post:
      operationId: exportDocument
      summary: >
        Produce an export receipt from the document's latest export
        approval. Refused if that approval is stale against the current
        revision, or if a named artifact no longer matches the hash its
        own validation manifest recorded. Exporting the same approval again
        answers with the receipt that already exists, so a repeated request
        issues no second receipt and no second audit entry.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "201":
          description: Exported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportReceiptResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}/export-receipt:
    get:
      operationId: getLatestExportReceipt
      summary: The latest export receipt recorded for this document, if any.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportReceiptResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/uploads/{artifactId}/preview:
    get:
      operationId: previewArtifact
      summary: >
        Stream a READY artifact's exact stored bytes with an inline
        disposition, for a client that displays them directly -- the
        workspace's PDF preview fetches a compiled PDF this way. Cache-Control
        is private, no-store.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: The artifact's stored bytes, with its detected media type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/uploads/{artifactId}/download:
    get:
      operationId: downloadArtifact
      summary: >
        Stream a READY artifact's exact stored bytes with an attachment
        disposition, forcing a save-as -- used to fetch an export's
        compiled DOCX/PDF by the artifact ID an export receipt names.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: The artifact's stored bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workspaces/{workspaceId}/deletions:
    get:
      operationId: listDeletions
      summary: >
        The workspace's deletion ledger, most recent first: what is in the
        trash, what was restored, and what was deleted for good. A title is
        present only while a document is still in the trash; the ledger
        itself keeps ids, states and times, never what a person wrote.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Every deletion request of the workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeletionResponse"
    post:
      operationId: createDeletion
      summary: >
        With scope DOCUMENT, moves one document to the trash: it disappears
        from every read, its unfinished jobs are cancelled, no change to it
        is accepted, and it can be restored until it is deleted for good or
        its retention runs out. Trashing a document already in the trash
        answers with the entry that holds it. With scope WORKSPACE, deletes
        the caller's own workspace for good in this call, including the
        caller's identity record; every session of the caller has ended by
        the time it returns. Only the workspace's owner may ask. It happens
        entirely or not at all: while a worker is still stopping one of the
        workspace's jobs the answer is 409 and nothing has changed.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeletionRequest"
      responses:
        "200":
          description: The workspace is gone. Its stored files are removed in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionResponse"
        "201":
          description: The document is in the trash (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The caller is not a member of this workspace, or is a member but not its owner and asked to delete it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            A worker is still stopping one of the workspace's jobs (code
            DELETION_WAITING_FOR_RUNNING_WORK). Nothing was deleted and no
            session was ended; the same request succeeds once that job has
            stopped.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/deletions/{deletionId}:
    get:
      operationId: getDeletion
      summary: >
        One deletion request and how far it has got. After something is
        deleted for good, pendingObjectCount is how many of its stored files
        the worker has not removed yet, and the state becomes VERIFIED once
        that is zero and a recount finds nothing left.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeletionId"
      responses:
        "200":
          description: The deletion request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workspaces/{workspaceId}/deletions/{deletionId}/restore:
    post:
      operationId: restoreDeletion
      summary: >
        Takes a document back out of the trash exactly as it was. Jobs that
        were cancelled when it went in stay cancelled. Restoring something
        already restored answers with the same entry.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeletionId"
      responses:
        "200":
          description: The document is back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: It was already deleted for good (code DELETION_NOT_OPEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/deletions/{deletionId}/purge:
    post:
      operationId: purgeDeletion
      summary: >
        Deletes a trashed document for good. Every database row that belongs
        to it is removed before this returns, so nothing can read it again;
        its stored files, and any source file nothing else uses, are queued
        and removed by the worker. Deleting something already deleted
        answers with the same entry.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeletionId"
      responses:
        "200":
          description: Deleted for good.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Either it was restored first (code DELETION_NOT_OPEN), or a
            worker is still stopping a job for this document (code
            DELETION_WAITING_FOR_RUNNING_WORK); nothing was deleted, and the
            same request succeeds once that job has stopped.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/usage:
    get:
      operationId: getWorkspaceUsage
      summary: >
        What this workspace has used of its model allowance in the current
        calendar month (UTC). It reports this workspace's figures only: of
        the allowance every workspace shares, it says whether it is used
        up and never how much anybody else spent.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: This month's usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"

  /api/v1/workspaces/{workspaceId}/support-grants:
    get:
      operationId: listSupportGrants
      summary: Every support grant this workspace has given, most recent first, open or not.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace's support grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportGrantResponse"
    post:
      operationId: createSupportGrant
      summary: >
        The workspace's owner lets support act in this workspace, for one
        scope and a whole number of days, seven at most. It carries no
        free text. One grant per scope is open at a time; giving and
        revoking are both written to the workspace's audit record.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportGrantRequest"
      responses:
        "201":
          description: The grant, open from now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportGrantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A grant of this scope is already open (code SUPPORT_GRANT_ALREADY_OPEN); revoke it first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/support-grants/{grantId}/revoke:
    post:
      operationId: revokeSupportGrant
      summary: Takes an open support grant back, effective immediately.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/GrantId"
      responses:
        "200":
          description: The grant, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportGrantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No open grant with this id is visible in this workspace; one already revoked, or past its expiry, is not open.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections:
    get:
      operationId: listConnections
      summary: >
        Every connection to an outside account this person has made in this
        workspace, disconnected ones included, newest first. A connection is
        the caller's own; another member's never appears. No token, and no
        provider-side account identifier, is ever part of the answer.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The caller's connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionResponse"
        "403":
          description: The caller may not manage connections in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections/google:
    post:
      operationId: startGoogleConsent
      summary: >
        Starts a consent for one kind of access to the caller's Google
        account and answers with the address of Google's consent page, which
        the page then navigates to itself. Nothing is stored until Google
        sends the person back to the consent callback. Checked against the
        session's CSRF token like every change; the answer is not cached.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConsentRequest"
      responses:
        "200":
          description: Where to send the person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The caller may not manage connections in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This deployment has no Google connection set up (code CONNECTOR_NOT_CONFIGURED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections/google/drive/picks:
    post:
      operationId: startDrivePick
      summary: >
        Starts a pick on Google's own file picker and answers with its
        address, which the page navigates to. It is a Drive consent with the
        picker turned on (Google allows only the drive.file permission on
        it), so it also connects Drive the way connecting again does, and it
        needs no Drive connection first. Google sends the person back to the
        consent callback with the chosen files' ids, and the callback records
        the Google Docs and plain-text files among them, at most ten, as the
        files Brownie may read. Checked against the session's CSRF token; the
        answer is not cached.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnTo:
                  type: string
                  description: /connections (the default) or a document's own address.
      responses:
        "200":
          description: Where to send the person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The caller may not manage connections in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Drive is not offered here: Google is not set up, nothing that can read Drive files is plugged in, or it
            is switched off (code CONNECTOR_NOT_CONFIGURED). Nothing is sent to Google.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections/google/drive/imports:
    post:
      operationId: importDriveFile
      summary: >
        Copies one file the caller picked in Google Drive into a document as a
        text source: a Google Doc as the plain text Google's own export of it
        produces, a plain-text file as it is. The file is named by the id of
        the caller's choice (a grant from the connections list), never by
        Drive's own id. Drive is asked what the file is before anything is
        read and again after, so the copy is the version it names; the text
        goes through the same checks as an upload; and the source says where
        it came from. The same version, or a later version whose text is
        unchanged, links the copy already made (newCopy false); a changed file
        is a new copy, and the old one stays. The copy is linked to the
        document in the same step.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportDriveFileRequest"
      responses:
        "201":
          description: The document's source for the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveImportResponse"
        "400":
          description: A missing or non-positive document or grant id (code MALFORMED_REQUEST).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not manage connections or sources in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such document for the caller, or it is in the trash (code NOT_FOUND); or the grant is not an open Drive
            choice of the caller's (code CONNECTOR_RESOURCE_NOT_FOUND); or the caller has no Drive connection
            (code CONNECTION_NOT_FOUND). For a document that is missing or in the trash, and a grant that was not open
            when the request arrived, Google is not asked anything. A grant taken back or disconnected while the copy
            was being made, or one made through a connection since replaced, is found only after Google was asked;
            it also answers CONNECTOR_RESOURCE_NOT_FOUND, and nothing new is kept or linked. In the moment between
            Google taking a disconnected token back and Brownie recording the disconnect, the answer can instead be
            CONNECTION_RECONNECT_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The file cannot be read now (code CONNECTOR_RESOURCE_UNAVAILABLE, with reason GONE or ACCESS_LOST, both of
            which also take it off the caller's list, or TRASHED, DOWNLOAD_RESTRICTED or CHANGED_DURING_COPY), the
            connection must be made again (code CONNECTION_RECONNECT_REQUIRED), Drive is not offered here
            (code CONNECTOR_NOT_CONFIGURED), or the organization managing the account does not allow the app
            (code CONNECTOR_BLOCKED_BY_ORGANIZATION).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than Brownie accepts as a source (code CONNECTOR_RESOURCE_TOO_LARGE).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Brownie's checks refused the copy (code CONNECTOR_RESOURCE_REFUSED, with the artifact's rejection reason), or
            the file is not one Brownie copies (code CONNECTOR_RESOURCE_UNSUPPORTED, with reason TYPE for anything but a
            Google Doc or a plain-text file, or NOT_UTF8 for text not saved as UTF-8).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Google could not answer now (code CONNECTOR_PROVIDER_UNAVAILABLE, with Retry-After), refused Brownie's own
            setup (code CONNECTOR_MISCONFIGURED), or the malware scanner or file storage could not be reached
            (code SCANNER_UNAVAILABLE or STORAGE_UNAVAILABLE).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections/google/drive/files/{grantId}/forget:
    post:
      operationId: forgetDriveFile
      summary: >
        Stops Brownie reading one file the caller picked. Copies already made
        from it stay with the documents that use them. Answers with every
        connection as it now stands, as disconnecting does. Never refused for
        Drive being switched off, and asks Google nothing.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/GrantId"
      responses:
        "200":
          description: The caller's connections after forgetting the file.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionResponse"
        "403":
          description: The caller may not manage connections in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The grant is not an open Drive choice of the caller's (code CONNECTOR_RESOURCE_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections/google/disconnect:
    post:
      operationId: disconnectGoogle
      summary: >
        Disconnects every Google connection the caller has in this
        workspace: each token is revoked at Google and wiped here whatever
        Google answers, and every read it had been granted is revoked.
        Copies already taken through it stay with the documents that use
        them. Answers with every connection as it now stands; asking again
        changes nothing.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The caller's connections after disconnecting.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionResponse"
        "403":
          description: The caller may not manage connections in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections/google/calendar/events:
    get:
      operationId: listCalendarEvents
      summary: >
        The events on the caller's own primary Google calendar that overlap
        a window of at most 31 days, repeating events expanded into their
        occurrences, in start order, at most 50. Reading the calendar is
        recorded as the caller's choice (a read-only grant for it). Only
        ordinary events are listed, and only what choosing one needs; who
        was invited is never read. Everything is as planned in the calendar.
        The answer carries the caller's calendar, so it is never cached.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: from
          in: query
          required: true
          description: The start of the window, a date and time with its UTC offset, such as 2026-09-24T00:00:00-07:00.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: >
            The end of the window, at least a minute and at most 31 days after from (two hours more are
            allowed, so that a month of local days that contains a change of clocks fits).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The events in the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventsResponse"
        "400":
          description: A window that is missing, not a date and time with its offset, too short or too long (code MALFORMED_REQUEST).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not manage connections in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no Calendar connection here (code CONNECTION_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The connection must be made again (code CONNECTION_RECONNECT_REQUIRED, with access and reason),
            Google is not set up on this deployment (code CONNECTOR_NOT_CONFIGURED), or the organization
            managing the account does not allow the app (code CONNECTOR_BLOCKED_BY_ORGANIZATION).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Google's answer was larger than Brownie reads; a shorter window may help (code CONNECTOR_RESOURCE_TOO_LARGE).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Google could not answer now or is limiting requests (code CONNECTOR_PROVIDER_UNAVAILABLE, with Retry-After),
            or refused Brownie's own setup, such as the calendar service not being enabled for it (code CONNECTOR_MISCONFIGURED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{workspaceId}/connections/google/calendar/imports:
    post:
      operationId: importCalendarEvent
      summary: >
        Copies one event of the caller's own primary Google calendar into a
        document as a text source. The event is read again by its id, so the
        copy is what the calendar holds now; it is written out as text whose
        times are labelled as planned, with their time zone, and all-day
        events as dates; the text goes through the same checks as an upload;
        and the source says where it came from. The same version of the same
        event, or a later version whose text is unchanged (a guest replying,
        say), links the copy already made (newCopy false); a change the text
        shows is a new copy, and the old one stays. The copy is linked to the
        document in the same step, so a document moved to the trash meanwhile
        takes it along.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCalendarEventRequest"
      responses:
        "201":
          description: The document's source for the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarImportResponse"
        "400":
          description: A missing document id or an event id that cannot be one (code MALFORMED_REQUEST).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not manage connections or sources in this workspace (code FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such document for the caller, or it is in the trash, and Google is not asked (code NOT_FOUND); or the
            caller has no Calendar connection here, including one disconnected while the copy was being made
            (code CONNECTION_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The event is gone or was cancelled (code CONNECTOR_RESOURCE_UNAVAILABLE, with reason GONE or CANCELLED),
            the connection must be made again (code CONNECTION_RECONNECT_REQUIRED), Google is not set up here
            (code CONNECTOR_NOT_CONFIGURED), or the organization managing the account does not allow the app
            (code CONNECTOR_BLOCKED_BY_ORGANIZATION).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The event is larger than Brownie copies (code CONNECTOR_RESOURCE_TOO_LARGE).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Brownie's checks refused the copy (code CONNECTOR_RESOURCE_REFUSED, with the artifact's rejection reason), or
            the event is not one Brownie copies: a whole repeating series rather than one of its occurrences, or not an
            ordinary event (code CONNECTOR_RESOURCE_UNSUPPORTED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Google could not answer now (code CONNECTOR_PROVIDER_UNAVAILABLE, with Retry-After), refused Brownie's own
            setup (code CONNECTOR_MISCONFIGURED), or the malware scanner or file storage could not be reached
            (code SCANNER_UNAVAILABLE or STORAGE_UNAVAILABLE).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/connectors/google/callback:
    get:
      operationId: googleConsentCallback
      summary: >
        Where Google sends a person back after its consent page. It is a
        page a browser is sent to, not a request the web app makes: it
        always answers with a redirect to the page the consent was started
        from, carrying google=connected and access, or google=failed with
        access (when a consent was pending) and one of these reason codes:
        no_pending_request, state_mismatch, expired, not_allowed,
        not_configured, issuer_mismatch, no_code, permission_not_granted,
        no_refresh_token, different_account, blocked_by_organization,
        consent_expired, google_unavailable, not_connected, provider_error,
        Google's own error code when it is a plain lowercase word (such as
        access_denied), or signed_out when the Brownie session has ended.
        no_pending_request and signed_out always return to /connections. A
        consent started as a Drive pick that completes carries google=picked
        and access=drive_files instead, with five counts: added (files picked
        that are now on the caller's list, one already there included),
        unsupported (not a Google Doc or a plain-text file), unavailable
        (Drive would not describe it), unchecked (not reached) and over_limit
        (past the ten a pick adds); and, when the pick stopped before every
        file was checked for a reason other than Drive not answering,
        stopped=token_refused (the connection must be made again),
        blocked_by_organization or not_configured. Drive is connected by then,
        and anything added before a stop stays on the list. A pick with
        nothing chosen still connects Drive, and says added=0.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
        - name: picked_file_ids
          in: query
          required: false
          description: >
            Google's picker only. The chosen files' ids, comma separated. Read only on the answer to a pick this
            session started, after every check has passed, and only ids Drive then describes become the caller's
            choices.
          schema:
            type: string
      responses:
        "302":
          description: Back to the page the consent was started from, with its outcome.

components:
  parameters:
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DeletionId:
      name: deletionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource is not visible in this workspace.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state or an idempotency key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableContent:
      description: The typed request is well formed but semantically invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: The named approval or manifest is stale against the document's current revision.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >
        Something the service depends on is away, and the same request is
        worth making again shortly; nothing was lost or changed. The code
        says what: STORAGE_UNAVAILABLE (files cannot be stored or read),
        SCANNER_UNAVAILABLE (an upload cannot be scanned yet, and stays
        unreadable until it is), RENDERER_BUSY (every slot for preparing a
        document stayed taken; with a Retry-After header), or
        DATABASE_UNAVAILABLE, which any route at all can answer and which is
        therefore not repeated under each one.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    UsageLimitReached:
      description: >
        A model allowance is used up (code USAGE_LIMIT_REACHED): what is
        left would not hold this request, or the first request of this
        run. Nothing was sent to the model and nothing was queued. The
        error's limit property says which allowance. A replay of a start
        that was accepted earlier is answered with that start instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MeResponse:
      type: object
      required: [userId, issuer, subject, memberships]
      properties:
        userId:
          type: integer
          format: int64
        issuer:
          type: string
        subject:
          type: string
        email:
          type: string
        displayName:
          type: string
        memberships:
          type: array
          items:
