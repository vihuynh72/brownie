      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        revisionId:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        docxArtifactId:
          type: integer
          format: int64
        docxSha256:
          type: string
        pdfArtifactId:
          type: integer
          format: int64
          nullable: true
        pdfSha256:
          type: string
