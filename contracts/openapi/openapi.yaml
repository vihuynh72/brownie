      properties:
        text:
          type: string
          maxLength: 1000

    AssistExecuteRequest:
      type: object
      required: [text, expectedRevisionId]
      properties:
        text:
          type: string
          maxLength: 1000
        expectedRevisionId:
          type: integer
          format: int64

    AssistScopeResponse:
      type: object
      properties:
        fieldId:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        currentValue:
          type: string
          nullable: true
        findingMessage:
          type: string
          nullable: true

    AssistInterpretationResponse:
      type: object
      required: [kind, summary, executable, usesModel, help]
      properties:
        kind:
          type: string
          enum: [DRAFT, CHANGE_FIELD, REWRITE_FIELD, EXPLAIN_FINDING, NONE]
        summary:
          type: string
        scope:
          allOf:
            - $ref: "#/components/schemas/AssistScopeResponse"
          nullable: true
        executable:
          type: boolean
        usesModel:
          type: boolean
        help:
          type: array
          items:
            type: string

    AssistExecutionResponse:
      type: object
      required: [kind, summary, help]
      properties:
        kind:
          type: string
          enum: [DRAFT, CHANGE_FIELD, REWRITE_FIELD, EXPLAIN_FINDING, NONE]
        summary:
          type: string
        proposal:
          allOf:
            - $ref: "#/components/schemas/PatchProposalResponse"
          nullable: true
        explanation:
          type: string
          nullable: true
        help:
          type: array
          items:
            type: string

    EvidenceExcerptResponse:
      type: object
      required: [spanId, sourceSnapshotId, sourceArtifactId, locatorType, excerptText]
      properties:
        spanId:
          type: integer
          format: int64
        sourceSnapshotId:
          type: integer
          format: int64
        sourceArtifactId:
          type: integer
          format: int64
        displayFilename:
          type: string
          nullable: true
        locatorType:
          type: string
          enum: [DOCX, PDF, PLAIN_TEXT]
          description: >
            The source format the span was cited in. No page or position on
            the compiled preview is known for any of them; the renderer emits
            no locator, and the workspace says so.
        excerptText:
          type: string

    GenerationRunResponse:
      type: object
      required: [id, jobId, documentId, baseRevisionId, sourceSnapshotId, sourceArtifactId, modelName, promptVersion, createdAt, job]
      properties:
        id:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        baseRevisionId:
          type: integer
          format: int64
          description: The document revision that was current when the run started.
        sourceSnapshotId:
          type: integer
          format: int64
        sourceArtifactId:
          type: integer
          format: int64
        modelName:
          type: string
        promptVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        job:
          $ref: "#/components/schemas/JobResponse"
        resultArtifactId:
          type: integer
          format: int64
          nullable: true
          description: The published extraction result, once the job succeeded.

    StartExtractionRequest:
      type: object
      required: [sourceArtifactId]
      properties:
        sourceArtifactId:
          type: integer
          format: int64
          minimum: 1

    ExtractionResultResponse:
      type: object
      required: [artifactId]
      properties:
        artifactId:
          type: integer
          format: int64
          description: Download this artifact's bytes through the existing generic /uploads/{artifactId}/download route.

    QuestionCandidateOptionResponse:
      type: object
      required: [value, evidenceSpanIds]
      properties:
        value:
          type: string
        evidenceSpanIds:
          type: array
          items:
            type: integer
            format: int64

    QuestionResponse:
      type: object
      required: [id, fieldId, reason, candidates, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fieldId:
          type: string
        reason:
          type: string
          enum: [MISSING_REQUIRED, CONFLICT]
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/QuestionCandidateOptionResponse"
        status:
          type: string
          enum: [OPEN, ANSWERED]
        answerValue:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AnswerQuestionRequest:
      type: object
      required: [answerValue]
      properties:
        answerValue:
          type: string
          minLength: 1

    ProposedFieldResponse:
      type: object
      description: >
        Exactly one of value (SCALAR) or values (REPEATED) is set, the
        same shape FieldValueResponse uses for a stored field.
      required: [type, cardinality, evidenceSpanIds]
      properties:
        type:
          type: string
          enum: [TEXT, DATE]
        cardinality:
          type: string
          enum: [SCALAR, REPEATED]
        value:
          type: [string, "null"]
        values:
          type: [array, "null"]
          items:
            type: string
        evidenceSpanIds:
          type: array
          items:
            type: integer
            format: int64

    SkippedRepeatedItemResponse:
      type: object
      description: >
        A repeated row (an action item, in the built-in templates) the
        extraction result contained but the proposal could not carry:
        a row is only proposed whole, and the content model has no slot
        for an unknown owner or due date. Reported by name rather than
        dropped silently.
      required: [itemIndex, unresolvedFieldIds]
      properties:
        itemIndex:
          type: integer
          description: The row's zero-based position in the extraction result.
        unresolvedFieldIds:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
          description: The row's first usable text, typically the task itself, bounded in length.

    PatchProposalResponse:
      type: object
      required: [id, documentId, baseRevisionId, proposedValues, status, createdAt, proposedRepeatedItemCount, skippedRepeatedItems]
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        baseRevisionId:
          type: integer
          format: int64
        proposedValues:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProposedFieldResponse"
        status:
          type: string
          enum: [PROPOSED, ACCEPTED]
        createdAt:
          type: string
          format: date-time
        proposedRepeatedItemCount:
          type: integer
          description: How many complete repeated rows the proposal carries.
        skippedRepeatedItems:
          type: array
          items:
            $ref: "#/components/schemas/SkippedRepeatedItemResponse"

    LogoutResponse:
      type: object
      required: [redirectUrl]
      properties:
        redirectUrl:
          type: string
          description: Where the page navigates next to finish signing out at the identity provider.

    AcceptPatchProposalRequest:
      type: object
      required: [expectedRevisionId]
      properties:
        expectedRevisionId:
          type: integer
          format: int64
          minimum: 1
        editReason:
          type: string
          nullable: true
          description: Defaults to a fixed reason when blank or omitted.

    PatchAcceptResponse:
      type: object
      required: [applied, fieldStatuses]
      properties:
        applied:
          type: boolean
        fieldStatuses:
          type: object
          additionalProperties:
            type: string
            enum: [CLEAN, CONFLICT, LOCKED]
        revision:
          allOf:
            - $ref: "#/components/schemas/DocumentRevisionResponse"
          nullable: true
          description: Present only when at least one field actually applied.

    RuleScopeRequest:
      type: object
      required: [kind]
      description: fieldId is required only for a SINGLE_FIELD scope; ignored for WHOLE_TEMPLATE.
      properties:
        kind:
          type: string
          enum: [WHOLE_TEMPLATE, SINGLE_FIELD]
        fieldId:
          type: string
          nullable: true

    RulePayloadRequest:
      type: object
      required: [kind]
      description: >
        One flat shape for all ten rule payload kinds -- the same "only the
        sub-fields the chosen kind actually needs are populated" convention
        FieldDefinitionRequest's own binding already establishes for
        choosing a field binding's own two kinds; every other property is
        omitted or null.
      properties:
        kind:
          type: string
          enum:
            - REQUIRED_FIELDS
            - MAX_TEXT_LENGTH
            - MAX_ITEM_COUNT
            - ALLOWED_SECTION_ORDER
            - DATE_DISPLAY_FORMAT
            - ALLOWED_SOURCE_KINDS
            - MISSING_VALUE_BEHAVIOR
            - ALLOWED_OVERFLOW_BEHAVIOR
            - REPEATABLE_REGION_EMPTY_BEHAVIOR
            - PROTECTED_REGION
        fieldId:
          type: string
          nullable: true
          description: Required by every kind except REQUIRED_FIELDS, ALLOWED_SECTION_ORDER, and PROTECTED_REGION.
        fieldIds:
          type: array
          nullable: true
          description: REQUIRED_FIELDS only -- one or more real field IDs.
          items:
            type: string
        maxCharacters:
          type: integer
          nullable: true
          minimum: 1
          description: MAX_TEXT_LENGTH only.
        maxItems:
          type: integer
          nullable: true
          minimum: 1
          description: MAX_ITEM_COUNT only.
        orderedSectionIds:
          type: array
          nullable: true
          description: ALLOWED_SECTION_ORDER only -- a freeform ordered list of section identifiers the person types themselves.
          items:
            type: string
        dateFormatStyle:
          type: string
          nullable: true
          description: DATE_DISPLAY_FORMAT only.
          enum: [LONG, SHORT, ISO]
        allowedSourceKinds:
          type: array
          nullable: true
          description: ALLOWED_SOURCE_KINDS only -- ARTIFACT is the only source kind this codebase produces today.
          items:
            type: string
            enum: [ARTIFACT]
        emptyValueResolution:
          type: string
          nullable: true
          description: MISSING_VALUE_BEHAVIOR or REPEATABLE_REGION_EMPTY_BEHAVIOR only.
          enum: [OMIT, BLANK, PLACEHOLDER_TEXT]
        overflowResolution:
          type: string
          nullable: true
          description: ALLOWED_OVERFLOW_BEHAVIOR only.
          enum: [BLOCK_EXPORT, ALLOW_REFLOW]
        protectedRegionTarget:
          allOf:
            - $ref: "#/components/schemas/BindingRequest"
          nullable: true
          description: PROTECTED_REGION only.

    ProposeRuleRequest:
      type: object
      required: [scope, payload]
      properties:
        scope:
          $ref: "#/components/schemas/RuleScopeRequest"
        payload:
          $ref: "#/components/schemas/RulePayloadRequest"
        humanExplanation:
          type: string
          nullable: true

    RuleResponse:
      type: object
