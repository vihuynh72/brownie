          items:
            $ref: "#/components/schemas/FieldDefinitionRequest"

    ActivateVersionRequest:
      type: object
      required: [expectedVersionNumber]
      properties:
        expectedVersionNumber:
          type: integer
          minimum: 1

    CandidateFieldBindingResponse:
      type: object
      required: [fieldId, type, cardinality, contentControlTag]
      properties:
        fieldId:
          type: string
        type:
          type: string
          enum: [TEXT, DATE]
        cardinality:
          type: string
          enum: [SCALAR, REPEATED]
        contentControlTag:
          type: string

    CandidateBindingReportResponse:
      type: object
      required: [candidates, ambiguousContentControlTags]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateFieldBindingResponse"
        ambiguousContentControlTags:
          type: array
          items:
            type: string

    AttachSourceRequest:
      type: object
      required: [artifactId]
      properties:
        artifactId:
          type: integer
          format: int64
          minimum: 1

    SnapshotResponse:
      type: object
