          format: date-time
        job:
          $ref: "#/components/schemas/JobResponse"
        resultArtifactId:
          type: integer
          format: int64
          nullable: true
          description: The published extraction result, once the job succeeded.

    StartExtractionRequest:
      type: object
      required: [sourceArtifactId]
      properties:
        sourceArtifactId:
          type: integer
          format: int64
          minimum: 1

    ExtractionResultResponse:
      type: object
      required: [artifactId]
      properties:
        artifactId:
          type: integer
          format: int64
          description: Download this artifact's bytes through the existing generic /uploads/{artifactId}/download route.

    QuestionCandidateOptionResponse:
      type: object
      required: [value, evidenceSpanIds]
      properties:
        value:
          type: string
        evidenceSpanIds:
          type: array
          items:
            type: integer
            format: int64

    QuestionResponse:
      type: object
      required: [id, fieldId, reason, candidates, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fieldId:
          type: string
        reason:
          type: string
          enum: [MISSING_REQUIRED, CONFLICT]
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/QuestionCandidateOptionResponse"
        status:
          type: string
          enum: [OPEN, ANSWERED]
        answerValue:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AnswerQuestionRequest:
      type: object
      required: [answerValue]
      properties:
        answerValue:
          type: string
          minLength: 1

    ProposedFieldResponse:
      type: object
      description: >
        Exactly one of value (SCALAR) or values (REPEATED) is set, the
        same shape FieldValueResponse uses for a stored field.
      required: [type, cardinality, evidenceSpanIds]
      properties:
        type:
          type: string
          enum: [TEXT, DATE]
        cardinality:
          type: string
          enum: [SCALAR, REPEATED]
        value:
          type: [string, "null"]
        values:
          type: [array, "null"]
          items:
            type: string
        evidenceSpanIds:
          type: array
          items:
            type: integer
            format: int64

    SkippedRepeatedItemResponse:
      type: object
      description: >
        A repeated row (an action item, in the built-in templates) the
        extraction result contained but the proposal could not carry:
        a row is only proposed whole, and the content model has no slot
        for an unknown owner or due date. Reported by name rather than
        dropped silently.
      required: [itemIndex, unresolvedFieldIds]
      properties:
        itemIndex:
          type: integer
          description: The row's zero-based position in the extraction result.
        unresolvedFieldIds:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
          description: The row's first usable text, typically the task itself, bounded in length.

    PatchProposalResponse:
      type: object
      required: [id, documentId, baseRevisionId, proposedValues, status, createdAt, proposedRepeatedItemCount, skippedRepeatedItems]
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        baseRevisionId:
          type: integer
          format: int64
        proposedValues:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProposedFieldResponse"
        status:
          type: string
          enum: [PROPOSED, ACCEPTED]
        createdAt:
          type: string
          format: date-time
        proposedRepeatedItemCount:
          type: integer
          description: How many complete repeated rows the proposal carries.
        skippedRepeatedItems:
          type: array
          items:
            $ref: "#/components/schemas/SkippedRepeatedItemResponse"

    LogoutResponse:
      type: object
      required: [redirectUrl]
      properties:
        redirectUrl:
          type: string
          description: Where the page navigates next to finish signing out at the identity provider.

    AcceptPatchProposalRequest:
      type: object
      required: [expectedRevisionId]
      properties:
        expectedRevisionId:
          type: integer
          format: int64
          minimum: 1
        editReason:
          type: string
          nullable: true
          description: Defaults to a fixed reason when blank or omitted.

    PatchAcceptResponse:
      type: object
      required: [applied, fieldStatuses]
      properties:
        applied:
          type: boolean
        fieldStatuses:
          type: object
          additionalProperties:
            type: string
            enum: [CLEAN, CONFLICT, LOCKED]
        revision:
          allOf:
            - $ref: "#/components/schemas/DocumentRevisionResponse"
          nullable: true
          description: Present only when at least one field actually applied.

    RuleScopeRequest:
      type: object
      required: [kind]
      description: fieldId is required only for a SINGLE_FIELD scope; ignored for WHOLE_TEMPLATE.
      properties:
        kind:
          type: string
          enum: [WHOLE_TEMPLATE, SINGLE_FIELD]
        fieldId:
          type: string
          nullable: true

    RulePayloadRequest:
      type: object
      required: [kind]
      description: >
        One flat shape for all ten rule payload kinds -- the same "only the
        sub-fields the chosen kind actually needs are populated" convention
        FieldDefinitionRequest's own binding already establishes for
        choosing a field binding's own two kinds; every other property is
        omitted or null.
      properties:
        kind:
          type: string
          enum:
            - REQUIRED_FIELDS
            - MAX_TEXT_LENGTH
            - MAX_ITEM_COUNT
            - ALLOWED_SECTION_ORDER
            - DATE_DISPLAY_FORMAT
            - ALLOWED_SOURCE_KINDS
            - MISSING_VALUE_BEHAVIOR
            - ALLOWED_OVERFLOW_BEHAVIOR
            - REPEATABLE_REGION_EMPTY_BEHAVIOR
            - PROTECTED_REGION
        fieldId:
          type: string
          nullable: true
          description: Required by every kind except REQUIRED_FIELDS, ALLOWED_SECTION_ORDER, and PROTECTED_REGION.
        fieldIds:
          type: array
          nullable: true
          description: REQUIRED_FIELDS only -- one or more real field IDs.
          items:
            type: string
        maxCharacters:
          type: integer
          nullable: true
          minimum: 1
          description: MAX_TEXT_LENGTH only.
        maxItems:
          type: integer
          nullable: true
          minimum: 1
          description: MAX_ITEM_COUNT only.
        orderedSectionIds:
          type: array
          nullable: true
          description: ALLOWED_SECTION_ORDER only -- a freeform ordered list of section identifiers the person types themselves.
          items:
            type: string
        dateFormatStyle:
          type: string
          nullable: true
          description: DATE_DISPLAY_FORMAT only.
          enum: [LONG, SHORT, ISO]
        allowedSourceKinds:
          type: array
          nullable: true
          description: >
            ALLOWED_SOURCE_KINDS only -- ARTIFACT is an uploaded file; GOOGLE_CALENDAR is an event copied
            from the person's own Google calendar; GOOGLE_DRIVE is a file the person picked in Google Drive.
          items:
            type: string
            enum: [ARTIFACT, GOOGLE_CALENDAR, GOOGLE_DRIVE]
        emptyValueResolution:
          type: string
          nullable: true
          description: MISSING_VALUE_BEHAVIOR or REPEATABLE_REGION_EMPTY_BEHAVIOR only.
          enum: [OMIT, BLANK, PLACEHOLDER_TEXT]
        overflowResolution:
          type: string
          nullable: true
          description: ALLOWED_OVERFLOW_BEHAVIOR only.
          enum: [BLOCK_EXPORT, ALLOW_REFLOW]
        protectedRegionTarget:
          allOf:
            - $ref: "#/components/schemas/BindingRequest"
          nullable: true
          description: PROTECTED_REGION only.

    ProposeRuleRequest:
      type: object
      required: [scope, payload]
      properties:
        scope:
          $ref: "#/components/schemas/RuleScopeRequest"
        payload:
          $ref: "#/components/schemas/RulePayloadRequest"
        humanExplanation:
          type: string
          nullable: true

    RuleResponse:
      type: object
      required: [id, templateId, templateVersionId, category, scope, payload, status, authorUserId, createdAt]
      properties:
        id:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        category:
          type: string
          enum: [VISUAL, CONTENT, BEHAVIOR, VALIDATION, SOURCE]
        scope:
          $ref: "#/components/schemas/RuleScopeRequest"
        payload:
          $ref: "#/components/schemas/RulePayloadRequest"
        status:
          type: string
          enum: [PROPOSED, ACCEPTED, REJECTED]
        humanExplanation:
          type: string
          nullable: true
        authorUserId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    ValidateDocumentRequest:
      type: object
      required: [expectedRevisionId]
      properties:
        expectedRevisionId:
          type: integer
          format: int64

    ValidationFindingResponse:
      type: object
      required: [code, severity, fieldId, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [BLOCKING, WARNING, INFORMATIONAL]
        fieldId:
          type: string
          nullable: true
        message:
          type: string

    ValidationManifestResponse:
      type: object
      required:
        [id, documentId, revisionId, templateId, templateVersionId, docxArtifactId, docxSha256, findings, hasUnresolvedBlocking, createdAt]
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        revisionId:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        docxArtifactId:
          type: integer
          format: int64
        docxSha256:
          type: string
        pdfArtifactId:
          type: integer
          format: int64
          nullable: true
        pdfSha256:
          type: string
          nullable: true
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFindingResponse"
        hasUnresolvedBlocking:
          type: boolean
        createdAt:
          type: string
          format: date-time

    IntegrityFindingResponse:
      type: object
      required: [fieldId, expectedText, foundInDocx, foundInPdf]
      properties:
        fieldId:
          type: string
        expectedText:
          type: string
        foundInDocx:
          type: boolean
        foundInPdf:
          type: boolean

    CompilationManifestResponse:
      type: object
      required:
        [id, documentId, revisionId, templateId, templateVersionId, docxArtifactId, docxSha256, pdfArtifactId, pdfSha256,
         rendererVersion, integrityFindings, allIntegrityChecksPassed, compiledAt]
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        revisionId:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        docxArtifactId:
          type: integer
          format: int64
        docxSha256:
          type: string
        pdfArtifactId:
          type: integer
          format: int64
        pdfSha256:
          type: string
        rendererVersion:
          type: string
        integrityFindings:
          type: array
          items:
            $ref: "#/components/schemas/IntegrityFindingResponse"
        allIntegrityChecksPassed:
          type: boolean
        compiledAt:
          type: string
          format: date-time

    ApproveExportRequest:
      type: object
      required: [validationManifestId, format]
      properties:
        validationManifestId:
          type: integer
          format: int64
        format:
          type: string
          enum: [DOCX, PDF, BOTH]

    ExportApprovalResponse:
      type: object
      required: [id, documentId, revisionId, templateVersionId, validationManifestId, format, approvedAt]
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        revisionId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        validationManifestId:
          type: integer
          format: int64
        format:
          type: string
          enum: [DOCX, PDF, BOTH]
        approvedAt:
          type: string
          format: date-time

    ExportReceiptResponse:
      type: object
      required:
        [id, documentId, revisionId, templateVersionId, exportApprovalId, validationManifestId, docxArtifactId, docxSha256,
         format, isCompletePair, exportedAt]
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        revisionId:
          type: integer
          format: int64
        templateVersionId:
          type: integer
          format: int64
        exportApprovalId:
          type: integer
          format: int64
        validationManifestId:
          type: integer
          format: int64
        docxArtifactId:
          type: integer
          format: int64
        docxSha256:
          type: string
        pdfArtifactId:
          type: integer
          format: int64
          nullable: true
        pdfSha256:
          type: string
          nullable: true
        format:
          type: string
          enum: [DOCX, PDF, BOTH]
        isCompletePair:
          type: boolean
        exportedAt:
          type: string
          format: date-time
    CreateDeletionRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [DOCUMENT, WORKSPACE]
        documentId:
          type: integer
          format: int64
          minimum: 1
          description: Required when scope is DOCUMENT; must be absent when scope is WORKSPACE.
    DeletionResponse:
      type: object
      required: [id, scope, targetId, state, requestedAt, pendingObjectCount]
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          enum: [DOCUMENT, WORKSPACE]
        targetId:
          type: integer
          format: int64
        state:
          type: string
          enum: [TRASHED, RESTORED, PURGED, VERIFIED]
          description: >
            TRASHED is restorable. PURGED means every database row is gone
            and access has ended, while stored files may still be waiting
            for removal. VERIFIED means a recount found nothing left.
        title:
          type: [string, "null"]
          description: The document's title, only while it is still in the trash.
        requestedAt:
          type: string
          format: date-time
        purgeAfter:
          type: [string, "null"]
          format: date-time
          description: When something in the trash is deleted for good if nobody restores it first.
        restoredAt:
          type: [string, "null"]
          format: date-time
        purgedAt:
          type: [string, "null"]
          format: date-time
        verifiedAt:
          type: [string, "null"]
          format: date-time
        pendingObjectCount:
          type: integer
          minimum: 0
    WorkspaceDeletionResponse:
      type: object
      required: [deletionId]
      properties:
        deletionId:
          type: integer
          format: int64
          description: The ledger entry that records the deletion. Nobody can read it through the API afterwards.
    UsageResponse:
      type: object
      required: [monthUsedUsd, monthLimitUsd, monthRemainingUsd, monthRequests, sharedAllowanceExhausted]
      properties:
        monthUsedUsd:
          type: number
          description: What this workspace's model requests cost this calendar month (UTC); a request still in flight counts at the amount held for it.
        monthLimitUsd:
          type: number
        monthRemainingUsd:
          type: number
          minimum: 0
        monthRequests:
          type: integer
          minimum: 0
        sharedAllowanceExhausted:
          type: boolean
          description: True when the allowance every workspace shares would not hold even the cheapest request, whatever this workspace has left.
    CreateSupportGrantRequest:
      type: object
      required: [scope, days]
      properties:
        scope:
          type: string
          enum: [METADATA, CONTENT]
          description: CONTENT (documents and files themselves) includes METADATA (states, codes, timings, counts).
        days:
          type: integer
          minimum: 1
          maximum: 7
    SupportGrantResponse:
      type: object
      required: [id, scope, grantedAt, expiresAt, active]
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          enum: [METADATA, CONTENT]
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        active:
          type: boolean
          description: Neither revoked nor expired at the moment of the response.

    StartConsentRequest:
      type: object
      required: [access]
      properties:
        access:
          type: string
          enum: [DRIVE_FILES, CALENDAR_EVENTS]
        returnTo:
          type: string
          description: The page to come back to, /connections (the default) or a document's own address.
    ConsentStartResponse:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
    ConnectionResponse:
      type: object
      required: [id, provider, access, state, grantedScopes, connectedAt]
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum: [GOOGLE]
        access:
          type: string
          enum: [DRIVE_FILES, CALENDAR_EVENTS]
        state:
          type: string
          enum: [ACTIVE, RECONNECT_REQUIRED, DISCONNECTED]
        accountEmail:
          type: [string, "null"]
          description: The Google account's address as Google reported it, for showing back to the person; absent when Google did not say.
        grantedScopes:
          type: array
          items:
            type: string
          description: What Google says it granted, which a person can make narrower than what was asked for.
        reconnectReason:
          type: [string, "null"]
          enum: [TOKEN_REJECTED, TOKEN_UNREADABLE, PERMISSION_MISSING, null]
        connectedAt:
          type: string
          format: date-time
        tokenIssuedAt:
          type: [string, "null"]
          format: date-time
          description: When the person last agreed.
        disconnectedAt:
          type: [string, "null"]
          format: date-time
        providerRevocation:
          type: [string, "null"]
          enum: [REVOKED, FAILED, NOT_NEEDED, null]
          description: On a disconnected connection, what Google said when asked to forget Brownie's access.
        grants:
          type: array
          description: >
            What the person chose for Brownie to read through this connection, still open. Always
            empty for a disconnected connection, whose choices were all revoked. A server from
            before this list existed leaves it out.
          items:
            $ref: "#/components/schemas/ResourceGrantResponse"

    ResourceGrantResponse:
      type: object
      description: >
        Something the person chose for Brownie to read through a connection. Brownie only ever
        reads it; the provider's own identifier for it is never shown.
      required: [id, type, grantedAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [CALENDAR, DRIVE_FILE]
        displayName:
          type: [string, "null"]
        grantedAt:
          type: string
          format: date-time

    DataPracticesResponse:
      type: object
      required:
        [trashRetentionDays, abandonedUploadHours, refusedFileHours, unusedFileHours, auditRecordDays, modelProvider, modelName]
      properties:
        trashRetentionDays:
          type: integer
          minimum: 1
        abandonedUploadHours:
          type: integer
          minimum: 1
          description: After how long an upload that was never finished is removed.
        refusedFileHours:
          type: integer
          minimum: 1
          description: After how long a refused or quarantined file loses its stored bytes.
        unusedFileHours:
          type: integer
          minimum: 1
          description: After how long a file nothing refers to is removed.
        auditRecordDays:
          type: integer
          minimum: 1
        modelProvider:
          type: string
        modelName:
          type: string
        supportContact:
          type: [string, "null"]
          description: Whoever runs this deployment published this; absent until they have.
