title = "brownie gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Azurite's fixed, publicly documented local-emulator development account key -- identical on every Azurite installation everywhere, not tied to any real Azure resource, and meaningless outside a local emulator instance."
regexes = [
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
]

[[allowlists]]
description = "Azure's own built-in role definition identifiers, which are the same public constants in every subscription in the world -- Microsoft documents them by these exact values. They are named permissions, not credentials: knowing one grants nothing. They are allowed by their exact values rather than by path, so that a real secret in the same file would still be found."
regexes = [
  # AcrPull, AcrPush
  '''7f951dda-4ed3-4680-a7ca-43fe172d538d''',
  '''8311e382-0749-4cb8-b61a-304f252e45ec''',
  # Key Vault Secrets User, Key Vault Secrets Officer
  '''4633458b-17de-408a-b874-0445c86b69e6''',
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',
  # Storage Blob Data Contributor
  '''ba92f5b4-2d11-453d-a403-e96b0029c9fe''',
  # Virtual Machine Contributor, Reader
  '''9980e02c-c2be-4d73-94e8-173b1dc7cf3c''',
  '''acdd72a7-3385-48ef-bd42-f606fba81ae7''',
]
