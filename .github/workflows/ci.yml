name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check README and formatting
        shell: bash
        run: |
          test "$(git ls-files '*.md')" = "README.md"
          grep -qx '# Brownie' README.md
          grep -qx '## Run' README.md
          grep -Fqx './scripts/verify-toolchain.sh' README.md
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  toolchain-and-scaffolds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Verify pinned toolchain
        run: ./scripts/verify-toolchain.sh
      - name: Build scaffolds when present
        shell: bash
        run: |
          if [ -f backend/pom.xml ]; then
            ./backend/mvnw -B verify
          else
            echo "INFO: Backend scaffold is not present."
          fi

          if [ -f apps/web/package.json ]; then
            cd apps/web
            npm ci
            npm run build
          else
            echo "INFO: Frontend scaffold is not present."
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
