# Included by every block that answers a browser, either directly or through
# brownie-security-headers.conf, which adds the site-wide content security
# policy on top. A location that serves a page carrying its own policy --
# /mcp-auth/'s consent screen -- includes only this file.
#
# It has to be an include rather than one declaration at the top: an
# add_header anywhere in a block replaces every header inherited from the
# block above it, so a location that sets a cache header would otherwise
# silently drop the security ones with it.
#
# Two years of strict transport security, subdomains included, because this
# name has none of its own and a browser that has seen this once will not be
# talked into plain HTTP again.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
