# Included by every block that answers a browser.
#
# It has to be an include rather than one declaration at the top: an
# add_header anywhere in a block replaces every header inherited from the
# block above it, so a location that sets a cache header would otherwise
# silently drop the security ones with it.
#
# Two years of strict transport security, subdomains included, because this
# name has none of its own and a browser that has seen this once will not be
# talked into plain HTTP again.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# The built application loads no third-party script, style or font: every one
# of its files comes from this origin, the typeface included. The two
# exceptions state themselves -- the PDF viewer starts a worker and draws
# pages, and both can come from a blob this page made.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
