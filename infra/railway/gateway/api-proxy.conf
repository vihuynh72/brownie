proxy_pass http://$brownie_api:8081;
proxy_http_version 1.1;
proxy_set_header Host brownie.up.railway.app;
# shortcut: callers can share an edge IP, add a verified trusted-proxy policy when per-client limits are needed.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host brownie.up.railway.app;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded "";
proxy_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
