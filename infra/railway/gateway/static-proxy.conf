# Never send the browser's cookies, authorization, query string, or body to Vercel.
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host brownie-khaki.vercel.app;
proxy_set_header X-Brownie-Gateway 1;
proxy_set_header Content-Length "";
proxy_ssl_server_name on;
proxy_ssl_name brownie-khaki.vercel.app;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_hide_header Cache-Control;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_pass https://$brownie_frontend$uri;
